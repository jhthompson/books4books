[project]
name = "books4books"
version = "0.1.0"
description = "Django application for swapping books"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url==3.1.2",
    "django==5.2.17",
    "django-allauth==65.19.0",
    "django-anymail[mailgun]==15.1",
    "django-isbn-field==0.5.3",
    "gunicorn==26.0.0",
    "pillow==12.3.0",
    "psycopg==3.3.4",
    "python-dotenv==1.2.2",
    "sentry-sdk[django]==2.67.1",
    "zxing-cpp==3.1.1",
]

[dependency-groups]
dev = [
    "djade==1.9.0",
    "django-debug-toolbar==7.1.0",
    "ruff==0.16.2",
]

[tool.ruff]
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]

[tool.ruff.lint.isort.sections]
"django" = ["django"]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "django",
    "first-party",
    "local-folder",
]
